<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>CodingColor - 4BINF</title>
    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>
<body>

<main class="scheda-principale">
    <header class="intestazione">
        <h1 id="titolo-benvenuto">CodingColor</h1>
        <p id="data-odierna">Data di oggi</p>
    </header>

    <section class="area-input">
        <div class="gruppo-campo">
            <label for="input-valore-rgb">Valore canale (0 - 255):</label>
            <input type="number" id="input-valore-rgb" min="0" max="255" placeholder="Es. 75">
        </div>

        <div class="gruppo-campo">
            <label for="input-nome-colore">Etichetta / Nome colore:</label>
            <input type="text" id="input-nome-colore" placeholder="Es. Johnny">
        </div>

        <div class="bottoni-azione">
            <button type="button" id="btn-aggiungi" onclick="elabora()">Aggiungi valore</button>
            <button type="button" id="btn-reset" onclick="reset()">Reset</button>
        </div>
        
        <p id="messaggio-errore" class="errore"></p>
    </section>

    <section class="stato-canali">
        <span id="badge-r" class="badge">R: -</span>
        <span id="badge-g" class="badge">G: -</span>
        <span id="badge-b" class="badge">B: -</span>
    </section>

    <!-- Rettangolo anteprima colore -->
    <section class="area-anteprima">
        <div id="riquadro-colore">
            <span id="testo-dentro-riquadro">Anteprima</span>
        </div>
        <p id="codice-rgb-testo">rgb(?, ?, ?)</p>
    </section>

    <footer>
        <p>Fatto e curato da John Hole</p>
    </footer>
</main>

<script src="script.js"></script>
</body>
</html>
